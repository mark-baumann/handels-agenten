name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      service_name:
        required: true
        type: string
        description: "Docker-Compose service name"
      port:
        required: true
        type: string
        description: "Service port"

# The reusable deployment workflow logs into GHCR with the caller's token.
# Explicitly grant package publishing rights to avoid `write_package` failures.
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: mark-baumann/infrastruktur-deployment/.github/workflows/build-deploy.yml@master
    with:
      service_name: ${{ inputs.service_name || 'handels-agenten' }}
      port: ${{ inputs.port || '8000' }}
      app_file: "web/app.py"
    secrets: inherit
